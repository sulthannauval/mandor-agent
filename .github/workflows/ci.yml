name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Shell scripts
        run: shellcheck --severity=style install.sh bin/* templates/project/env.sh

      - name: Guard tests
        run: python tests/test_guard.py

      - name: Config tests
        run: |
          python -m pip install --quiet pyyaml
          python tests/test_config.py

      - name: Installer in a throwaway HOME
        run: |
          home="$(mktemp -d)"
          HOME="$home" ./install.sh --no-skills
          HOME="$home" ./install.sh --no-skills > second-run.log
          if grep -E '^(linked|relinked|wrote|replaced)' second-run.log; then
            echo "a second install changed files"
            exit 1
          fi
          HOME="$home" ./install.sh --uninstall
          test -z "$(find "$home" -type l -lname "$PWD/*")"
